# Deploys the static site to Cloudflare Pages on every push to main.
# Requires one repository secret:
#   CLOUDFLARE_API_TOKEN — token with "Cloudflare Pages: Edit" permission
# (Create at https://dash.cloudflare.com/profile/api-tokens — template "Cloudflare Pages — Edit".
#  Project name comes from wrangler.toml; created automatically on first deploy.)
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Non-interactive runners refuse npx's "install missing package?" prompt.
      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy . --project-name=qr-scanner
